<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  </head>
  <body>
    <h2>Please Input Your Details</h2>
    <form id="registerForm">

    </form>
  </body>
  <script src="index.js"></script>
</html>
