<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Academic Horizon - Simulasi Nilai Rapor</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 700px;
      margin: 20px auto;
      padding: 10px;
      background-color: #f3f1fb;
    }
    h1 {
      color: #4338ca;
    }
    .kotak {
      background-color: white;
      padding: 15px;
      margin-bottom: 15px;
      border-radius: 8px;
    }
    input, select, button {
      padding: 7px;
      margin: 3px 0;
      font-size: 14px;
    }
    button {
      background-color: #4f46e5;
      color: white;
      border: none;
      border-radius: 5px;
      cursor: pointer;
    }
    .tombolHapus {
      background-color: #dc2626;
      padding: 4px 8px;
      font-size: 12px;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      margin: 8px 0;
    }
    th, td {
      border: 1px solid #ccc;
      padding: 6px;
      text-align: left;
    }
    th {
      background-color: #eef2ff;
    }
    .tercapai {
      color: green;
      font-weight: bold;
    }
    .belumTercapai {
      color: #dc2626;
      font-weight: bold;
    }
    #pesan {
      color: #dc2626;
      font-weight: bold;
    }
  </style>
</head>
<body>

  <h1>Academic Horizon</h1>
  <p>Simulasi nilai rapor: lihat nilai akhirmu dan berapa nilai yang kamu butuhkan supaya target tercapai.</p>

  <!-- ===== RINGKASAN ===== -->
  <div class="kotak">
    <h3>Ringkasan Semester</h3>
    <p id="ringkasan"></p>
  </div>

  <!-- ===== FORM TAMBAH MAPEL ===== -->
  <div class="kotak">
    <h3>1. Tambah Mata Pelajaran</h3>
    <input type="text" id="namaMapel" placeholder="Nama mapel, misal: Fisika">
    <input type="number" id="targetMapel" placeholder="Target nilai, misal: 80">
    <button onclick="tambahMapel()">Tambah Mapel</button>
  </div>

  <!-- ===== FORM TAMBAH PENILAIAN ===== -->
  <div class="kotak">
    <h3>2. Tambah Penilaian</h3>
    <select id="pilihMapel"></select><br>
    <input type="text" id="namaPenilaian" placeholder="Nama penilaian, misal: UTS"><br>
    <input type="number" id="bobotPenilaian" placeholder="Bobot (%), misal: 30"><br>
    <input type="number" id="nilaiPenilaian" placeholder="Nilai (0-100)"><br>
    <label>
      <input type="checkbox" id="sudahDinilai">
      Sudah dinilai guru (kalau tidak dicentang = nilai perkiraan)
    </label><br>
    <button onclick="tambahPenilaian()">Simpan Penilaian</button>
  </div>

  <p id="pesan"></p>

  <!-- ===== DAFTAR MAPEL ===== -->
  <div id="daftarMapel"></div>


  <script>
    // =====================================================
    // 1. AMBIL DATA DARI localStorage
    // =====================================================
    // Bentuk data:
    // [ { nama: "Matematika", target: 80,
    //     penilaian: [ { nama: "UH 1", bobot: 20, nilai: 85, sudah: true } ] } ]
    let daftarMapel = JSON.parse(localStorage.getItem("dataMapel"));

    // Kalau belum ada data, pakai contoh data
    if (daftarMapel == null) {
      daftarMapel = [
        {
          nama: "Matematika",
          target: 80,
          penilaian: [
            { nama: "Ulangan Harian", bobot: 30, nilai: 75, sudah: true },
            { nama: "UTS", bobot: 30, nilai: 78, sudah: true },
            { nama: "UAS", bobot: 40, nilai: 85, sudah: false }
          ]
        },
        {
          nama: "Bahasa Indonesia",
          target: 85,
          penilaian: [
            { nama: "Tugas", bobot: 40, nilai: 90, sudah: true },
            { nama: "UTS", bobot: 30, nilai: 84, sudah: true },
            { nama: "UAS", bobot: 30, nilai: 85, sudah: false }
          ]
        }
      ];
    }


    // =====================================================
    // 2. SIMPAN DATA KE localStorage
    // =====================================================
    function simpanData() {
      localStorage.setItem("dataMapel", JSON.stringify(daftarMapel));
    }


    // =====================================================
    // 3. FUNGSI MENGHITUNG NILAI
    // =====================================================

    // Menghitung nilai akhir satu mapel
    // Rumus: (nilai1 x bobot1 + nilai2 x bobot2 + ...) / total bobot
    function hitungNilaiAkhir(mapel) {
      let totalPoin = 0;
      let totalBobot = 0;

      for (let i = 0; i < mapel.penilaian.length; i++) {
        totalPoin = totalPoin + mapel.penilaian[i].nilai * mapel.penilaian[i].bobot;
        totalBobot = totalBobot + mapel.penilaian[i].bobot;
      }

      if (totalBobot == 0) {
        return 0;
      }
      return totalPoin / totalBobot;
    }

    // Menghitung nilai yang dibutuhkan di penilaian yang BELUM dinilai
    // supaya nilai akhir = target
    function hitungNilaiDibutuhkan(mapel) {
      let poinSudah = 0;
      let bobotSudah = 0;
      let bobotBelum = 0;

      for (let i = 0; i < mapel.penilaian.length; i++) {
        let p = mapel.penilaian[i];
        if (p.sudah == true) {
          poinSudah = poinSudah + p.nilai * p.bobot;
          bobotSudah = bobotSudah + p.bobot;
        } else {
          bobotBelum = bobotBelum + p.bobot;
        }
      }

      // Kalau semua sudah dinilai, tidak ada yang bisa dihitung lagi
      if (bobotBelum == 0) {
        return null;
      }

      let totalBobot = bobotSudah + bobotBelum;
      let poinTarget = mapel.target * totalBobot;
      return (poinTarget - poinSudah) / bobotBelum;
    }

    // Mengubah angka menjadi predikat A, B, C, D
    function predikat(nilai) {
      if (nilai >= 90) {
        return "A (Sangat Baik)";
      } else if (nilai >= 80) {
        return "B (Baik)";
      } else if (nilai >= 70) {
        return "C (Cukup)";
      } else {
        return "D (Perlu Bimbingan)";
      }
    }


    // =====================================================
    // 4. TAMBAH MAPEL
    // =====================================================
    function tambahMapel() {
      let nama = document.getElementById("namaMapel").value;
      let target = document.getElementById("targetMapel").value;

      if (nama == "" || target == "") {
        tampilkanPesan("Nama mapel dan target harus diisi!");
        return;
      }

      daftarMapel.push({ nama: nama, target: Number(target), penilaian: [] });
      simpanData();

      document.getElementById("namaMapel").value = "";
      document.getElementById("targetMapel").value = "";
      tampilkanPesan("");
      tampilkanSemua();
    }


    // =====================================================
    // 5. TAMBAH PENILAIAN
    // =====================================================
    function tambahPenilaian() {
      let nomorMapel = document.getElementById("pilihMapel").value;
      let nama = document.getElementById("namaPenilaian").value;
      let bobot = document.getElementById("bobotPenilaian").value;
      let nilai = document.getElementById("nilaiPenilaian").value;
      let sudah = document.getElementById("sudahDinilai").checked;

      if (nomorMapel == "" || nama == "" || bobot == "" || nilai == "") {
        tampilkanPesan("Semua kolom penilaian harus diisi!");
        return;
      }

      if (nilai < 0 || nilai > 100) {
        tampilkanPesan("Nilai harus antara 0 sampai 100!");
        return;
      }

      daftarMapel[nomorMapel].penilaian.push({
        nama: nama,
        bobot: Number(bobot),
        nilai: Number(nilai),
        sudah: sudah
      });
      simpanData();

      document.getElementById("namaPenilaian").value = "";
      document.getElementById("bobotPenilaian").value = "";
      document.getElementById("nilaiPenilaian").value = "";
      document.getElementById("sudahDinilai").checked = false;
      tampilkanPesan("");
      tampilkanSemua();
    }


    // =====================================================
    // 6. HAPUS DATA
    // =====================================================
    function hapusMapel(nomor) {
      daftarMapel.splice(nomor, 1);   // hapus 1 data di posisi "nomor"
      simpanData();
      tampilkanSemua();
    }

    function hapusPenilaian(nomorMapel, nomorPenilaian) {
      daftarMapel[nomorMapel].penilaian.splice(nomorPenilaian, 1);
      simpanData();
      tampilkanSemua();
    }

    function tampilkanPesan(teks) {
      document.getElementById("pesan").innerHTML = teks;
    }


    // =====================================================
    // 7. TAMPILKAN SEMUA DATA KE LAYAR
    // =====================================================
    function tampilkanSemua() {
      let html = "";
      let pilihan = "";
      let jumlahNilai = 0;

      for (let i = 0; i < daftarMapel.length; i++) {
        let mapel = daftarMapel[i];
        let nilaiAkhir = hitungNilaiAkhir(mapel);
        let dibutuhkan = hitungNilaiDibutuhkan(mapel);
        jumlahNilai = jumlahNilai + nilaiAkhir;

        // Pilihan mapel untuk form penilaian
        pilihan = pilihan + "<option value='" + i + "'>" + mapel.nama + "</option>";

        // Judul mapel
        html = html + "<div class='kotak'>";
        html = html + "<h3>" + mapel.nama + " (target: " + mapel.target + ")</h3>";

        // Tabel penilaian
        html = html + "<table>";
        html = html + "<tr><th>Penilaian</th><th>Bobot</th><th>Nilai</th><th>Status</th><th></th></tr>";

        for (let j = 0; j < mapel.penilaian.length; j++) {
          let p = mapel.penilaian[j];
          let status = "Perkiraan";
          if (p.sudah == true) {
            status = "Sudah dinilai";
          }
          html = html + "<tr>" +
            "<td>" + p.nama + "</td>" +
            "<td>" + p.bobot + "%</td>" +
            "<td>" + p.nilai + "</td>" +
            "<td>" + status + "</td>" +
            "<td><button class='tombolHapus' onclick='hapusPenilaian(" + i + "," + j + ")'>Hapus</button></td>" +
            "</tr>";
        }
        html = html + "</table>";

        // Hasil perhitungan
        html = html + "<p>Nilai akhir: <b>" + nilaiAkhir.toFixed(1) + "</b> - Predikat " + predikat(nilaiAkhir) + "</p>";

        if (nilaiAkhir >= mapel.target) {
          html = html + "<p class='tercapai'>Target tercapai!</p>";
        } else {
          html = html + "<p class='belumTercapai'>Target belum tercapai.</p>";
        }

        if (dibutuhkan != null) {
          if (dibutuhkan > 100) {
            html = html + "<p>Target sulit dicapai: butuh nilai " + dibutuhkan.toFixed(1) + " (lebih dari 100).</p>";
          } else if (dibutuhkan <= 0) {
            html = html + "<p>Target sudah aman, berapa pun nilai yang belum dinilai.</p>";
          } else {
            html = html + "<p>Supaya target tercapai, kamu butuh nilai minimal <b>" + dibutuhkan.toFixed(1) + "</b> di penilaian yang belum dinilai.</p>";
          }
        }

        html = html + "<button class='tombolHapus' onclick='hapusMapel(" + i + ")'>Hapus Mapel</button>";
        html = html + "</div>";
      }

      document.getElementById("daftarMapel").innerHTML = html;
      document.getElementById("pilihMapel").innerHTML = pilihan;

      // Ringkasan: rata-rata semua mapel
      if (daftarMapel.length == 0) {
        document.getElementById("ringkasan").innerHTML = "Belum ada mata pelajaran.";
      } else {
        let rataRata = jumlahNilai / daftarMapel.length;
        document.getElementById("ringkasan").innerHTML =
          "Jumlah mapel: " + daftarMapel.length + "<br>" +
          "Rata-rata nilai: <b>" + rataRata.toFixed(1) + "</b> - Predikat " + predikat(rataRata);
      }
    }

    // Jalankan saat halaman pertama kali dibuka
    tampilkanSemua();
  </script>

</body>
</html>
